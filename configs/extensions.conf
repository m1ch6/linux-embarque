; Dialplan for the doorbell device
; Contexts: internal (normal calls), ivr-main + ivr-choice (doorbell menu)

[general]
static=yes
writeprotect=no
clearglobalvars=no

; ============================================================
; INTERNAL: normal calls between extensions + feature codes
; ============================================================
[internal]

; --- Echo test (audio check) ---
exten => *43,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; --- Playback sanity test ---
exten => *44,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; --- Voicemail: check your own mailbox ---
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)})
 same => n,Hangup()

; --- Direct extension dialing (by name) ---
; Rings 4 times; if nobody picks up, the caller is offered the message flow
; (see [call-person]).
exten => hadji,1,Gosub(call-person,s,1(hadji,1001))
 same => n,Hangup()

exten => johnson,1,Gosub(call-person,s,1(johnson,1002))
 same => n,Hangup()

exten => miora,1,Gosub(call-person,s,1(miora,1003))
 same => n,Hangup()

exten => ulrich,1,Gosub(call-person,s,1(ulrich,1004))
 same => n,Hangup()

; --- Numeric extensions (dial by number) ---
; 1001 Hadji, 1002 Johnson, 1003 Miora, 1004 Ulrich
exten => 1001,1,Gosub(call-person,s,1(hadji,1001))
 same => n,Hangup()

exten => 1002,1,Gosub(call-person,s,1(johnson,1002))
 same => n,Hangup()

exten => 1003,1,Gosub(call-person,s,1(miora,1003))
 same => n,Hangup()

exten => 1004,1,Gosub(call-person,s,1(ulrich,1004))
 same => n,Hangup()

; --- IVR entry point (the doorbell) ---
exten => 9999,1,Goto(ivr-main,s,1)

; ============================================================
; IVR layer 1: who do you want to reach?
; ============================================================
[ivr-main]
exten => s,1,Answer()
 same => n,Set(TRIES=0)
 same => n(menu),Background(custom/welcome)
 same => n,WaitExten(7)

; Each choice remembers the baresip endpoint (PERSON) and the extension
; number (PNUM). The number prefixes the recording, so anything left here
; lands in that person's panel in the TUI.
exten => 1,1,Set(PERSON=hadji)
 same => n,Set(PNUM=1001)
 same => n,Goto(ivr-choice,s,1)
exten => 2,1,Set(PERSON=johnson)
 same => n,Set(PNUM=1002)
 same => n,Goto(ivr-choice,s,1)
exten => 3,1,Set(PERSON=miora)
 same => n,Set(PNUM=1003)
 same => n,Goto(ivr-choice,s,1)
exten => 4,1,Set(PERSON=ulrich)
 same => n,Set(PNUM=1004)
 same => n,Goto(ivr-choice,s,1)

; 0 re-plays the menu
exten => 0,1,Goto(s,menu)

; Invalid digit
exten => i,1,Set(TRIES=$[${TRIES}+1])
 same => n,GotoIf($[${TRIES} >= 3]?hangup:retry)
 same => n(retry),Playback(custom/invalid)
 same => n,Goto(s,menu)
 same => n(hangup),Playback(custom/goodbye)
 same => n,Hangup()

; Timeout (no digit pressed)
exten => t,1,Playback(custom/goodbye)
 same => n,Hangup()

; ============================================================
; IVR layer 2: call now, or leave a message?
; ============================================================
[ivr-choice]
exten => s,1,Set(TRIES=0)
 same => n(menu),Background(custom/choice-${PERSON})
 same => n,WaitExten(7)

; Choice 1 -> call now. Rings 4 times; if nobody picks up, the caller is
; offered the same message flow as choice 2 (see [call-person]).
exten => 1,1,Gosub(call-person,s,1(${PERSON},${PNUM}))
 same => n,Hangup()

; Choice 2 -> leave a message straight away (see [leave-message]).
exten => 2,1,Gosub(leave-message,s,1)
 same => n,Hangup()

exten => 0,1,Goto(s,menu)

; Invalid digit
exten => i,1,Set(TRIES=$[${TRIES}+1])
 same => n,GotoIf($[${TRIES} >= 3]?hangup:retry)
 same => n(retry),Playback(custom/invalid)
 same => n,Goto(s,menu)
 same => n(hangup),Playback(custom/goodbye)
 same => n,Hangup()

; Timeout (no digit pressed)
exten => t,1,Playback(custom/goodbye)
 same => n,Hangup()

; ============================================================
; Subroutine: start call recording
; ============================================================
; Records the call. ${ARG1} is the receiver (dialed extension), so the file is
; named <receiver>-<timestamp>-<uniqueid>.wav and can be listed per recipient.
; The name is also kept in ${RECFILE}, because a call that is never answered
; has its recording thrown away again (see [call-person]).
[record-call]
exten => s,1,Set(RECFILE=/var/spool/asterisk/monitor/${ARG1}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav)
 same => n,MixMonitor(${RECFILE})
 same => n,Return()

; ============================================================
; Subroutine: ring someone, then take a message if they don't answer
; ============================================================
; ${ARG1} = baresip endpoint (hadji..ulrich), ${ARG2} = extension number
; (1001..1004). The number names both the call recording and the message, so
; either one lands in that person's panel in the TUI.
[call-person]
exten => s,1,Set(PERSON=${ARG1})
 same => n,Set(PNUM=${ARG2})
 ; One ring is 4s of tone every 6s (see tui/sounds/ring.wav), so 4 rings = 24s.
 same => n,Set(RING_SECONDS=$[4 * 6])
 ; Leave a couple of seconds of slack: EPOCH has 1s resolution.
 same => n,Set(RING_MINUS=$[${RING_SECONDS} - 3])
 same => n,Gosub(record-call,s,1(${PNUM}))
 same => n,Set(CALL_START=${EPOCH})
 same => n,Dial(PJSIP/${PERSON},${RING_SECONDS})
 same => n,Set(ELAPSED=$[${EPOCH} - ${CALL_START}])
 ; Answered: the call happened, and its recording stands on its own.
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 ; Refused (the callee hung up on the ringing call -- baresip answers that with
 ; 486, i.e. BUSY) or cancelled: nothing was ever said, so drop the recording
 ; of the ringing and just end the call.
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?discard)
 same => n,GotoIf($["${DIALSTATUS}" = "CANCEL"]?discard)
 ; Unreachable at all: the extension is not registered (or congested). There is
 ; nobody to ring, so offer the message straight away.
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL"]?take)
 same => n,GotoIf($["${DIALSTATUS}" = "CONGESTION"]?take)
 ; The ringing stopped well before the fourth ring: somebody cut it short, so
 ; end the call as well. (Backstop for a refusal that does not report BUSY.)
 same => n,Set(EARLY=$[${ELAPSED} < ${RING_MINUS}])
 same => n,GotoIf($["${EARLY}" = "1"]?discard)
 ; Four full rings and no answer: that is the case the message is for.
 same => n(take),StopMixMonitor()
 same => n,System(rm -f "${RECFILE}")
 same => n,Gosub(leave-message,s,1)
 same => n,Goto(done)
 ; Refused or cut short: same cleanup, but no message is offered.
 same => n(discard),StopMixMonitor()
 same => n,System(rm -f "${RECFILE}")
 same => n(done),Return()

; ============================================================
; Subroutine: take a message
; ============================================================
; Prompt, beep, record, goodbye. Used by the IVR's "leave a message" choice and
; when a call is not answered. The file follows the same convention as a call
; recording (<number>-<timestamp>-<uniqueid>.wav) so the recipient can replay it
; from the TUI panel.
; Record takes (filename.format,silence,maxduration,options): stop after 5s of
; silence, and never run past 120s.
; The `k` option is essential: without it Asterisk *deletes* the recording when
; the caller hangs up while Record is still running (app_record.c: "Got hangup"
; -> ast_filedelete), which is exactly what happens to anyone who speaks and
; then presses hang up instead of waiting out the 5 seconds of silence.
[leave-message]
exten => s,1,Playback(custom/leave-msg)
 same => n,Playback(beep)
 same => n,Record(/var/spool/asterisk/monitor/${PNUM}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav,5,120,k)
 ; Record leaves its verdict in RECORD_STATUS (SILENCE, DTMF, HANGUP, TIMEOUT),
 ; which is worth having in the log: it says whether the caller stopped by
 ; pressing #, by going quiet, or by hanging up.
 same => n,NoOp(Message recording ended: ${RECORD_STATUS})
 same => n,Playback(custom/goodbye)
 same => n,Return()