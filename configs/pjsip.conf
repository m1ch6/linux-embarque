; PJSIP configuration for the doorbell device
; Two endpoints: visitor (doorbell side) and owner (house side)

; ---- Transport (UDP) ----
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---- Endpoint: hadji ----
[hadji]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw
allow=alaw
auth=hadji-auth
aors=hadji
callerid="Hadji" <hadji>
trust_id_inbound=yes

[hadji-auth]
type=auth
auth_type=userpass
username=hadji
password=pass_hadji

[hadji]
type=aor
max_contacts=1
remove_existing=yes

