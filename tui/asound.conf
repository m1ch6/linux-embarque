# ALSA config used by the TUI when launching baresip.
#
# It defines a `doorbell` PCM that routes capture and playback through the
# PipeWire echo-cancelled nodes created by `module-echo-cancel`:
#
#   doorbell_mic      <- real microphone, with the speaker output subtracted
#   doorbell_speaker  <- real speaker
#
# That subtraction is what removes the echo on a single machine: a softphone's
# microphone no longer re-captures the other softphone's speaker output.
#
# The TUI passes this file to baresip via the ALSA_CONFIG_PATH environment
# variable; it only does so when the echo-cancel module is available, and
# otherwise falls back to the plain `default` device.
<confdir:alsa.conf>

pcm.doorbell {
    type pipewire
    playback_node "doorbell_speaker"
    capture_node "doorbell_mic"
}
